[project]
name = "image-tool"
version = "0.1.0"
description = "读取图片信息并完成缩放、裁剪、旋转、翻转、灰度化和格式转换的命令行工具"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "ziquweimo" }]
dependencies = ["pillow>=9.0"]

[project.scripts]
imagetool = "image_tool.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/image_tool"]
